# --- GAT-SAC specific parameters ---

action_selector: "multinomial"
epsilon_start: 0.0
epsilon_finish: 0.0
epsilon_anneal_time: 1
mask_before_softmax: True

runner: "parallel"
batch_size_run: 8

buffer_size: 50000
batch_size: 32

target_update_interval_or_tau: 0.005

obs_agent_id: True
obs_last_action: False
obs_individual_obs: True

mac: "gat_sac_mac"
agent: "gat_ns"
agent_output_type: "pi_logits"
learner: "sac_learner"
critic_type: "sac_type_critic"
store_agent_types: True

lr: 0.0003
critic_lr: 0.0003
alpha_lr: 0.0003
optimizer: "adam"
optimizer_epsilon: 0.0000001

hidden_dim: 128
n_heads: 4
use_rnn: True
use_layer_norm: True
use_orthogonal: True
gain: 0.01

standardise_returns: False
standardise_rewards: True

lgdd_enabled: True
lgdd_pretrain_steps: 100000
lgdd_random_warmup: True
lgdd_continue_after_warmup: True
lgdd_pretrain_loss_weight: 1.0
lgdd_loss_weight: 0.1
lgdd_local_loss_weight: 1.0
lgdd_global_loss_weight: 1.0
lgdd_ema_tau: 0.01
lgdd_lr: 0.0003
lgdd_predictor_hidden_dim: 128

cl_enabled: True
cl_memory_buffer_size: 20000
cl_current_ratio: 0.75
cl_min_memory_episodes: 32
cl_policy_distill_weight: 0.05
cl_repr_weight: 0.05
cl_teacher_ema_tau: 0.002

name: "gat_sac"
