# ─── CASVD: GAT encoder + Soft-QMIX backbone ───

# ── Action selection ─────────────────────────────────────────
# Training: softmax(func_f(func_g(Q)) / α) sampling (soft policy)
# Test: greedy argmax on raw Q
action_selector: "soft_policy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000

# Runner
runner: "parallel"
batch_size_run: 8

# Replay buffer
buffer_size: 5000
batch_size: 128

# Target updates (hard copy every 200 episodes)
target_update_interval_or_tau: 200

# Observations
obs_agent_id: True
obs_last_action: True
obs_individual_obs: True

# Controller and agent
mac: "casvd_mac"
agent: "gat_ns"
agent_output_type: "q"
learner: "casvd_learner"

# ── Soft-QMIX mixer: VDN + func_f + func_g ──────────────────
# VDN (sum) for mixing — no QMIX amplification of entropy bonus.
# func_g: order-preserving residual (shapes Q landscape per agent).
# func_f: affine per-agent (learned per-state temperature).
mixer: "qmix"
mixing_embed_dim: 32
hypernet_embed: 64

# Optimizer
lr: 0.001
optimizer: "adam"
optimizer_epsilon: 0.0000001

# GAT encoder
hidden_dim: 128
n_heads: 4
use_rnn: True
use_layer_norm: True
use_orthogonal: True
encoder_gain: 1.0
q_head_gain: 0.1

# TD learning
gamma: 0.99
td_lambda: 0.4

# Gradient clipping
grad_norm_clip: 10

# Reward
standardise_returns: False
standardise_rewards: False

# ── Soft-QMIX entropy coefficient ───────────────────────────
# α = 0.03 (matches Soft-QMIX paper).  With VDN mixer the entropy
# bonus is amplified by exactly n_agents (predictable), so 0.03 is
# safe — unlike QMIX where the nonlinear mixer amplified it ~30×.
entropy_coef: 0.03

# ── α annealing schedule ──────────────────────────────────────
# After the policy's win rate saturates (~6–7M for GAT + Soft-QMIX),
# the constant entropy bonus dominates the optimisation signal and
# pulls the policy into stalling (longer episodes harvest more bonus).
# Annealing α toward a small floor in the post-saturation window kills
# this pressure and locks in the learned policy.
#
#   t < entropy_anneal_start         → α = entropy_coef            (full bonus)
#   t in [start, end]                → linear decay to floor
#   t ≥ entropy_anneal_end           → α = entropy_anneal_floor    (near-greedy)
entropy_anneal_enabled: True
entropy_anneal_start:   6000000
entropy_anneal_end:     9000000
entropy_anneal_floor:   0.005

# ── Components 3 & 4 disabled for baseline test ──────────────
lgdd_enabled: False
use_adaptive_alpha: False

# ── Continual learning (off) ─────────────────────────────────
cl_enabled: False
cl_memory_buffer_size: 10000
cl_current_ratio: 0.8
cl_min_memory_episodes: 128
cl_teacher_ema_tau: 0.002
cl_distill_weight: 0.05
cl_temperature: 0.1

store_agent_types: False

name: "casvd"
